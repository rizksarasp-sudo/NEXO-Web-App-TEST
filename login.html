```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f8faff">

    <title>NEXO - Log In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="nexo-auth-body">

    <main class="auth-page nexo-auth-page">

        <!-- Ambient background -->
        <div class="auth-glow auth-glow-one"></div>
        <div class="auth-glow auth-glow-two"></div>
        <div class="auth-glow auth-glow-three"></div>

        <!-- Mobile app login card -->
        <section class="auth-card nexo-auth-card">

            <!-- Brand -->
            <a href="index.html" class="nexo-brand">
                <img
                    src="lhttps://placehold.co/200x200/3157ff/ffffff.png?text=X"
                    alt="NEXO logo"
                    class="nexo-brand-logo"
                >
                <span>NEXO</span>
            </a>

            <!-- Heading -->
            <header class="nexo-auth-heading">
                <h1>Welcome back</h1>
                <p>Continue where you left off.</p>
            </header>

            <!-- Login form -->
            <form id="login-form" class="nexo-auth-form">

                <div class="input-group nexo-input-group">
                    <label for="login-email">Email address</label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group nexo-input-group">
                    <label for="login-password">Password</label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn signup-btn nexo-primary-btn"
                >
                    <span>Log in</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </button>

            </form>

            <!-- Supabase feedback -->
            <p
                id="login-message"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></p>

            <!-- Social login -->
            <div class="nexo-social-divider">
                <span>Or continue with</span>
            </div>

            <div class="social-buttons nexo-social-buttons">

                <button
                    type="button"
                    class="social-btn nexo-social-btn"
                    id="google-login"
                >
                    <span class="social-letter" aria-hidden="true">G</span>
                    Google
                </button>

                <button
                    type="button"
                    class="social-btn nexo-social-btn"
                    id="github-login"
                >
                    <span class="social-letter" aria-hidden="true">⌘</span>
                    GitHub
                </button>

            </div>

            <!-- Signup link -->
            <p class="auth-footer nexo-auth-footer">
                New to NEXO?
                <a href="signup.html">Create account</a>
            </p>

        </section>

        <p class="nexo-auth-caption">
            Learn <span>·</span> Build <span>·</span> Grow
        </p>

    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Existing NEXO JavaScript -->
    <script src="script.js"></script>

</body>

</html>
```
