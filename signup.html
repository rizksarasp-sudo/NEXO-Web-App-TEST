```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f8faff">

    <title>NEXO - Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="nexo-auth-body">

    <main class="auth-page nexo-auth-page">

        <!-- Ambient background -->
        <div class="auth-glow auth-glow-one"></div>
        <div class="auth-glow auth-glow-two"></div>
        <div class="auth-glow auth-glow-three"></div>

        <!-- Mobile app layout -->
        <section class="auth-card nexo-auth-card">

            <!-- Brand -->
            <a href="index.html" class="nexo-brand">
                <img
                    src="c:\Users\U\Downloads\logo.gif"
                    alt="NEXO logo"
                    class="nexo-brand-logo"
                >
                <span>NEXO</span>
            </a>

            <!-- Heading -->
            <header class="nexo-auth-heading">
                <h1>Create account</h1>
                <p>Start your learning journey.</p>
            </header>

            <!-- Signup form -->
            <form id="signup-form" class="nexo-auth-form">

                <div class="input-group nexo-input-group">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group nexo-input-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group nexo-input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn signup-btn nexo-primary-btn"
                >
                    <span>Create account</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </button>

            </form>

            <!-- Supabase feedback -->
            <p
                id="signup-message"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></p>

            <!-- Login link -->
            <p class="auth-footer nexo-auth-footer">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </section>

        <p class="nexo-auth-caption">
            Learn <span>·</span> Build <span>·</span> Grow
        </p>

    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Existing NEXO authentication logic -->
    <script src="script.js"></script>

</body>
</html>
