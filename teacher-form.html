```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO — Teacher Profile</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .teacher-page {
            min-height: 100vh;
            padding: 35px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            font-family: inherit;
        }

        .teacher-container {
            width: 100%;
            max-width: 480px;
            animation: teacherAppear .6s ease both;
        }

        .teacher-logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3157ff;
            font-size: 38px;
            font-weight: 800;
            animation: teacherFloat 3s ease-in-out infinite;
        }

        .teacher-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .teacher-tag {
            display: inline-block;
            color: #3157ff;
            background: #eef2ff;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .teacher-heading h1 {
            color: #111827;
            font-size: clamp(26px, 6vw, 32px);
            letter-spacing: -1px;
            margin: 0 0 12px;
        }

        .teacher-heading p {
            color: #7b8497;
            font-size: 14px;
            line-height: 1.7;
            margin: 0 auto;
            max-width: 360px;
        }

        .teacher-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .teacher-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .teacher-field label {
            color: #172033;
            font-size: 13px;
            font-weight: 650;
        }

        .teacher-field input,
        .teacher-field select,
        .teacher-field textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #e3e7ef;
            border-radius: 12px;
            background: #fff;
            color: #172033;
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s ease,
                        box-shadow .2s ease;
        }

        .teacher-field textarea {
            min-height: 105px;
            resize: vertical;
            line-height: 1.6;
        }

        .teacher-field input:focus,
        .teacher-field select:focus,
        .teacher-field textarea:focus {
            border-color: #3157ff;
            box-shadow: 0 0 0 3px rgba(49, 87, 255, .09);
        }

        .teacher-hint {
            color: #8992a4;
            font-size: 12px;
            line-height: 1.5;
        }

        .teacher-submit {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 16px;
            margin-top: 4px;
            color: #fff;
            background: #3157ff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease,
                        box-shadow .2s ease,
                        background .2s ease;
        }

        .teacher-submit:hover {
            background: #2446dc;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(49, 87, 255, .2);
        }

        .teacher-submit:active {
            transform: scale(.98);
        }

        .teacher-message {
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .teacher-back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #7b8497;
            font-size: 13px;
            text-decoration: none;
        }

        .teacher-back:hover {
            color: #3157ff;
        }

        @keyframes teacherAppear {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes teacherFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .teacher-container,
            .teacher-logo { animation: none; }

            .teacher-submit { transition: none; }
        }
    </style>
</head>

<body>
    <main class="teacher-page">
        <section class="teacher-container">

            <div class="teacher-logo" aria-label="NEXO logo">X</div>

            <header class="teacher-heading">
                <span class="teacher-tag">TEACHER COMMUNITY</span>
                <h1>Teach with NEXO.</h1>
                <p>
                    Share your programming expertise, create courses,
                    and help the next generation of developers grow.
                </p>
            </header>

            <form id="teacher-form" class="teacher-form">

                <div class="teacher-field">
                    <label for="teacher-name">Full name *</label>
                    <input
                        type="text"
                        id="teacher-name"
                        name="full_name"
                        placeholder="Your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="teacher-field">
                    <label for="teacher-email">Professional email *</label>
                    <input
                        type="email"
                        id="teacher-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="teacher-field">
                    <label for="teacher-title">Professional title *</label>
                    <input
                        type="text"
                        id="teacher-title"
                        name="professional_title"
                        placeholder="e.g. Software Engineer & Instructor"
                        required
                    >
                </div>

                <div class="teacher-field">
                    <label for="teacher-experience">Teaching experience *</label>
                    <select id="teacher-experience" name="teaching_experience" required>
                        <option value="">Select your experience</option>
                        <option value="beginner">Just getting started</option>
                        <option value="1-3">1–3 years</option>
                        <option value="4-6">4–6 years</option>
                        <option value="7+">7+ years</option>
                    </select>
                </div>

                <div class="teacher-field">
                    <label for="teacher-specialty">Main programming specialty *</label>
                    <select id="teacher-specialty" name="specialty" required>
                        <option value="">Choose your specialty</option>
                        <option value="web-development">Web Development</option>
                        <option value="python">Python</option>
                        <option value="data-science">Data Science</option>
                        <option value="artificial-intelligence">Artificial Intelligence</option>
                        <option value="mobile-development">Mobile Development</option>
                        <option value="cybersecurity">Cybersecurity</option>
                        <option value="software-engineering">Software Engineering</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="teacher-field">
                    <label for="teacher-bio">About you *</label>
                    <textarea
                        id="teacher-bio"
                        name="bio"
                        placeholder="Tell us about your background, skills, and teaching approach..."
                        minlength="30"
                        required
                    ></textarea>
                    <span class="teacher-hint">
                        Write at least 30 characters.
                    </span>
                </div>

                <div class="teacher-field">
                    <label for="teacher-course">First course idea</label>
                    <input
                        type="text"
                        id="teacher-course"
                        name="course_idea"
                        placeholder="e.g. Python for Beginners"
                    >
                    <span class="teacher-hint">
                        You can refine your course idea later.
                    </span>
                </div>

                <div class="teacher-field">
                    <label for="teacher-link">LinkedIn or portfolio link</label>
                    <input
                        type="url"
                        id="teacher-link"
                        name="portfolio_url"
                        placeholder="https://..."
                    >
                </div>

                <button type="submit" class="teacher-submit">
                    Submit application →
                </button>

                <p id="teacher-message"
                   class="teacher-message"
                   role="status"
                   aria-live="polite"></p>

            </form>

            <a href="role-selection.html" class="teacher-back">
                ← Back to role selection
            </a>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
```
